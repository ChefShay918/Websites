<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comic Guide List</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Comic Guide List</h1>
    <p class="subtitle">Track your collection, what you paid, and what it's worth.</p>
  </header>

  <main>
    <section class="stats" id="stats">
      <div class="stat-card">
        <span class="stat-label">Comics Tracked</span>
        <span class="stat-value" id="stat-count">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Spent</span>
        <span class="stat-value" id="stat-cost">$0.00</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Current Value</span>
        <span class="stat-value" id="stat-value">$0.00</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Realized Gain / Loss</span>
        <span class="stat-value" id="stat-realized">$0.00</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Gain / Loss</span>
        <span class="stat-value" id="stat-gain">$0.00</span>
      </div>
    </section>

    <section class="toolbar">
      <button id="btn-add" class="btn btn-primary">+ Add Comic</button>
      <input id="search" type="search" placeholder="Search title or series...">
      <select id="filter-status">
        <option value="all">All</option>
        <option value="owned">Owned</option>
        <option value="sold">Sold</option>
      </select>
      <select id="sort">
        <option value="added-desc">Newest Added</option>
        <option value="title-asc">Title (A-Z)</option>
        <option value="cost-desc">Cost (High-Low)</option>
        <option value="value-desc">Value (High-Low)</option>
        <option value="gain-desc">Gain (High-Low)</option>
      </select>
      <button id="btn-export" class="btn btn-secondary">Export</button>
      <label class="btn btn-secondary file-btn">
        Import
        <input id="btn-import" type="file" accept="application/json" hidden>
      </label>
    </section>

    <section id="empty-state" class="empty-state" hidden>
      <p>No comics yet. Add your first one to start tracking cost and value.</p>
    </section>

    <section class="comic-list-scroll">
      <div id="comic-list" class="comic-list"></div>
    </section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <form id="comic-form" class="modal">
      <h2 id="modal-title">Add Comic</h2>
      <input type="hidden" id="comic-id">

      <label>Title
        <input type="text" id="field-title" required placeholder="Amazing Spider-Man">
      </label>

      <div class="field-row">
        <label>Series
          <input type="text" id="field-series" placeholder="Amazing Spider-Man">
        </label>
        <label>Issue #
          <input type="text" id="field-issue" placeholder="300">
        </label>
      </div>

      <div class="field-row">
        <label>Publisher
          <input type="text" id="field-publisher" placeholder="Marvel">
        </label>
        <label>Condition / Grade
          <input type="text" id="field-condition" placeholder="NM 9.4">
        </label>
      </div>

      <div class="field-row">
        <label>Purchase Date
          <input type="date" id="field-date">
        </label>
        <label>Purchase Cost ($)
          <input type="number" id="field-cost" step="0.01" min="0" required>
        </label>
        <label>Current Value ($)
          <input type="number" id="field-current-value" step="0.01" min="0">
        </label>
      </div>

      <label>Notes
        <textarea id="field-notes" rows="2" placeholder="Key issue, first appearance, condition notes..."></textarea>
      </label>

      <label class="checkbox-field">
        <input type="checkbox" id="field-sold">
        Sold
      </label>

      <div class="field-row" id="sold-fields" hidden>
        <label>Sold Price ($)
          <input type="number" id="field-sold-price" step="0.01" min="0">
        </label>
        <label>Sold Date
          <input type="date" id="field-sold-date">
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-delete" class="btn btn-danger" hidden>Delete</button>
        <div class="spacer"></div>
        <button type="button" id="btn-cancel" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
